<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CapabilityNexus Phone</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .top {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1e293b;
  }
  .top input {
    flex: 1;
    padding: 8px;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #0f172a;
    color: #e2e8f0;
  }
  .top button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    font-weight: bold;
  }
  #lockOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999;
    background: rgba(15, 23, 42, 0.92);
  }
  #lockOverlay.on { display: block; }

  /* 悬浮球：始终最顶层，可拖动，功能菜单入口 */
  #dragBall {
    position: fixed;
    left: 8px;
    top: 10px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #22c55e;
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10001;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    opacity: 0.92;
  }
  #dragBall:active { transform: scale(1.1); }

  /* 悬浮球菜单 */
  #ballMenu {
    position: fixed;
    z-index: 10002;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 6px;
    display: none;
    flex-direction: column;
    min-width: 150px;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  #ballMenu.on { display: flex; }
  #ballMenu button {
    padding: 10px 14px;
    border: none;
    background: transparent;
    color: #e2e8f0;
    font-size: 15px;
    text-align: left;
    border-radius: 8px;
  }
  #ballMenu button:active { background: #334155; }
  #ballMenu .menu-label {
    padding: 4px 14px;
    font-size: 12px;
    color: #64748b;
  }
  .status {
    padding: 8px 14px;
    font-size: 13px;
  }
  .ok { color: #4ade80; }
  .err { color: #f87171; }

  .mode-row {
    padding: 6px 14px;
    display: flex;
    gap: 8px;
  }
  .mode-row button {
    flex: 1;
    padding: 10px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #1e293b;
    color: #cbd5e1;
  }
  .mode-row button.active {
    background: #2563eb;
    color: #fff;
  }

  .sensor-box {
    margin: 12px 14px;
    padding: 12px;
    background: #1e293b;
    border-radius: 10px;
    font-size: 13px;
  }
  .sensor-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-family: monospace;
  }

  /* 方向盘模式 */
  .wheel {
    margin: 20px auto;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: #1e293b;
    border: 4px solid #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.05s linear;
  }
  .wheel .hub {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #2563eb;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .wheel .spoke {
    position: absolute;
    width: 4px;
    height: 100%;
    background: #334155;
  }

  /* 触屏按钮 */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px 14px;
  }
  .btn {
    padding: 22px 0;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    background: #334155;
    color: #e2e8f0;
  }
  .btn.pressed { background: #2563eb; color: #fff; }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 12px 14px;
    max-width: 300px;
    margin: 0 auto;
  }
  .dpad .btn { padding: 16px 0; font-size: 14px; }

  .pedals {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
  }
  .pedal {
    flex: 1;
    height: 90px;
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    position: relative;
    border: 1px solid #334155;
  }
  .pedal .fill {
    width: 100%;
    background: #2563eb;
    transition: height 0.05s linear;
  }
  .pedal.gas .fill { background: #22c55e; }
  .pedal.brake .fill { background: #ef4444; }
  .pedal .label {
    position: absolute;
    top: 8px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="top">
  <input id="addr" type="text" value="" placeholder="自动使用当前地址（也可手动填 ws://PC-IP:8765/ws）">
</div>

<div class="status" id="status">未连接</div>

<!-- 锁定遮罩（悬浮球下层，覆盖全屏拦截触摸） -->
<div id="lockOverlay"></div>

<!-- 悬浮球：固定于左上角，点击弹出功能菜单 -->
<div id="dragBall">🔒</div>
<div id="ballMenu">
  <div class="menu-label">悬浮球菜单</div>
  <button id="menuConnect">🔌 连接 / 断开</button>
  <button id="menuFullscreen">⛶ 全屏</button>
  <button id="menuLock">🔒 锁定 / 解锁</button>
  <button id="menuCalAll">🎯 一键校准</button>
  <button id="menuCalSteer">↔ 校准方向盘</button>
  <button id="menuCalGas">🛞 校准油门</button>
  <button id="menuCalBrake">⛔ 校准刹车</button>
  <button id="menuClose">✕ 关闭菜单</button>
</div>

<div class="mode-row">
  <button id="modeWheel" class="active">方向盘</button>
  <button id="modePad">手柄</button>
</div>

<!-- 方向盘模式 -->
<div id="wheelMode">
  <div class="wheel" id="wheel">
    <div class="spoke"></div>
    <div class="hub">STEER</div>
  </div>
  <div class="sensor-box">
    <div class="sensor-row"><span>Steer (方向)</span><span id="v_roll">0.0</span></div>
    <div class="sensor-row"><span>Tilt (油门/刹车)</span><span id="v_pitch">0.0</span></div>
    <div class="sensor-row"><span>原始 α/β/γ</span><span id="v_raw">0 / 0 / 0</span></div>
    <button id="calBtn" style="width:100%;margin-top:8px;padding:10px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:bold;">校准（以当前姿态为 0 点）</button>
  </div>
  <div class="pedals">
    <div class="pedal gas">
      <div class="fill" id="gasFill" style="height:0%"></div>
      <div class="label">油门</div>
    </div>
    <div class="pedal brake">
      <div class="fill" id="brakeFill" style="height:0%"></div>
      <div class="label">刹车</div>
    </div>
  </div>
</div>

<!-- 手柄模式 -->
<div id="padMode" style="display:none">
  <div class="dpad">
    <div></div>
    <button class="btn" id="dpad_up" data-btn="up">▲</button>
    <div></div>
    <button class="btn" id="dpad_left" data-btn="left">◀</button>
    <div></div>
    <button class="btn" id="dpad_right" data-btn="right">▶</button>
    <div></div>
    <button class="btn" id="dpad_down" data-btn="down">▼</button>
    <div></div>
  </div>
  <div class="controls">
    <button class="btn" id="btn_x" data-btn="x">X</button>
    <button class="btn" id="btn_y" data-btn="y">Y</button>
    <button class="btn" id="btn_a" data-btn="a">A</button>
    <button class="btn" id="btn_b" data-btn="b">B</button>
  </div>
</div>

<script>
let ws = null;
let connected = false;
let mode = "wheel";

const addrInput = document.getElementById("addr");
const statusEl = document.getElementById("status");

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.className = "status " + (ok ? "ok" : "err");
}

// ---- 全屏 ----
function toggleFullscreen() {
  var doc = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (doc.requestFullscreen || doc.webkitRequestFullscreen || function() {}).call(doc);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function() {}).call(document);
  }
}
// ---- 悬浮球（固定左上角；点击弹出功能菜单） ----
var lockOverlay = document.getElementById("lockOverlay");
var dragBall = document.getElementById("dragBall");
var ballMenu = document.getElementById("ballMenu");
var locked = false;

function setLocked(state) {
  locked = state;
  lockOverlay.classList.toggle("on", state);
  ballMenu.classList.remove("on");
  dragBall.textContent = state ? "🔓" : "🔒";
}

// 点击悬浮球：弹出菜单
dragBall.addEventListener("click", function(e) {
  e.stopPropagation();
  openBallMenu();
});

// 点遮罩空白处关闭菜单
lockOverlay.addEventListener("pointerdown", function(e) {
  if (ballMenu.classList.contains("on")) {
    ballMenu.classList.remove("on");
  }
  e.preventDefault();
});


// 悬浮球菜单
function openBallMenu() {
  // 先显示再测量真实尺寸，避免横屏高度不足
  ballMenu.style.display = "flex";
  var mw = ballMenu.offsetWidth;
  var mh = ballMenu.offsetHeight;
  var vw = window.innerWidth, vh = window.innerHeight;

  // 菜单优先出现在悬浮球上方；空间不足则放下方
  var mx = ballX + 56;   // 悬浮球右侧
  var my = ballY - mh;   // 悬浮球上方
  if (my < 4) my = ballY + 56;  // 上方不够 → 下方
  // 确保不超出右/下边界
  mx = Math.min(mx, vw - mw - 4);
  my = Math.min(my, vh - mh - 4);
  if (mx < 4) mx = 4;
  if (my < 4) my = 4;

  ballMenu.style.left = mx + "px";
  ballMenu.style.top = my + "px";
  ballMenu.style.display = "none";
  ballMenu.classList.add("on");
}

document.getElementById("menuConnect").addEventListener("click", function() {
  ballMenu.classList.remove("on");
  toggleConnect();
});
document.getElementById("menuFullscreen").addEventListener("click", function() {
  ballMenu.classList.remove("on");
  toggleFullscreen();
});
document.getElementById("menuLock").addEventListener("click", function() {
  ballMenu.classList.remove("on");
  setLocked(!locked);
});
document.getElementById("menuCalAll").addEventListener("click", function() {
  ballMenu.classList.remove("on");
  calibrateAll();
});
document.getElementById("menuCalSteer").addEventListener("click", function() {
  ballMenu.classList.remove("on");
  calibrateSteer();
});
document.getElementById("menuCalGas").addEventListener("click", function() {
  ballMenu.classList.remove("on");
  calibrateGas();
});
document.getElementById("menuCalBrake").addEventListener("click", function() {
  ballMenu.classList.remove("on");
  calibrateBrake();
});
document.getElementById("menuClose").addEventListener("click", function() {
  ballMenu.classList.remove("on");
});

// 点遮罩空白处关闭菜单
lockOverlay.addEventListener("pointerdown", function(e) {
  if (ballMenu.classList.contains("on")) {
    ballMenu.classList.remove("on");
  }
  e.preventDefault();
});

// 悬浮球菜单（在 openBallMenu 中弹出，含锁定/解锁入口）

let autoReconnect = true;

function connect() {
  // 始终使用当前页面主机（自动匹配 PC IP + 端口）
  let url = (location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws";
  addrInput.value = url;
  if (!url) return;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    setStatus("连接失败: " + e.message, false);
    scheduleReconnect();
    return;
  }
  ws.onopen = () => {
    connected = true;
    setStatus("已连接: " + url, true);
    sendHello();
    sendAll();
  };
  ws.onclose = () => {
    connected = false;
    setStatus("已断开，自动重连中...", false);
    scheduleReconnect();
  };
  ws.onerror = (e) => {
    setStatus("连接错误", false);
  };
}

function scheduleReconnect() {
  if (!autoReconnect) return;
  setTimeout(function() {
    if (!connected) {
      try { connect(); } catch (e) {}
    }
  }, 2000);
}

// 悬浮球菜单：连接 / 断开
function toggleConnect() {
  if (connected) {
    autoReconnect = false;
    try { ws.close(); } catch (e) {}
    connected = false;
    setStatus("已断开", false);
  } else {
    autoReconnect = true;
    connect();
  }
}

// 页面加载后自动连接，无需点击
(function() {
  addrInput.value = (location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws";
  setStatus("自动连接中...", false);
  connect();
})();

// 连接通过悬浮球菜单 toggleConnect 控制（页面加载自动连接）

// 模式切换
document.getElementById("modeWheel").onclick = () => setMode("wheel");
document.getElementById("modePad").onclick = () => setMode("pad");

function setMode(m) {
  mode = m;
  document.getElementById("modeWheel").className = "mode-btn" + (m === "wheel" ? " active" : "");
  document.getElementById("modePad").className = "mode-btn" + (m === "pad" ? " active" : "");
  document.getElementById("wheelMode").style.display = m === "wheel" ? "block" : "none";
  document.getElementById("padMode").style.display = m === "pad" ? "block" : "none";
  document.getElementById("modeWheel").classList.toggle("active", m === "wheel");
  document.getElementById("modePad").classList.toggle("active", m === "pad");
}

// 传感器状态
let rawAlpha = 0, rawBeta = 0, rawGamma = 0;
let roll = 0, pitch = 0, yaw = 0;
let accelX = 0, accelY = 0, accelZ = 0;
let gas = 0, brake = 0;
let gyroAvailable = false;
let currentSteer = 0;   // 方向盘角度（校准后）
let currentPitch = 0;   // 俯仰（校准后）
let cal = { alpha: 0, beta: 0, gamma: 0, gas: 0, brake: 0, has: false };
const buttons = { a: false, b: false, x: false, y: false };
const dpad = { up: false, down: false, left: false, right: false };

// 校准工具：记录当前传感器值为起点
function snapOffset() {
  return { alpha: rawAlpha, beta: rawBeta, gamma: rawGamma };
}

// 一键校准：方向盘、油门、刹车都用当前值作起点
function calibrateAll() {
  if (!gyroAvailable) {
    setStatus("陀螺仪不可用，无法校准（请使用 HTTPS）", false);
    return;
  }
  var off = snapOffset();
  cal.alpha = off.alpha;
  cal.beta = off.beta;
  cal.gamma = off.gamma;
  cal.gas = off.beta;     // 油门起点 = 当前前后倾
  cal.brake = off.alpha;  // 刹车起点 = 当前上下倾
  cal.has = true;
  currentSteer = 0;
  currentPitch = 0;
  updateWheel();
  sendAll();
  setStatus("一键校准完成：方向盘/油门/刹车已归零", true);
}

// 单独校准
function calibrateSteer() {
  if (!gyroAvailable) return setStatus("陀螺仪不可用", false);
  cal.gamma = rawGamma;
  cal.has = true;
  currentSteer = 0;
  updateWheel(); sendAll();
  setStatus("方向盘已校准（当前为 0 点）", true);
}
function calibrateGas() {
  if (!gyroAvailable) return setStatus("陀螺仪不可用", false);
  cal.gas = rawBeta;
  cal.has = true;
  setStatus("油门已校准（当前前后倾为油门 0）", true);
}
function calibrateBrake() {
  if (!gyroAvailable) return setStatus("陀螺仪不可用", false);
  cal.brake = rawAlpha;
  cal.has = true;
  setStatus("刹车已校准（当前上下倾为刹车 0）", true);
}

// 设备方向（陀螺仪）
function handleOrientation(e) {
  if (!gyroAvailable) {
    gyroAvailable = true;
    setStatus(connected ? "已连接（陀螺仪可用，可校准）" : "自动连接中...", connected);
  }
  rawAlpha = e.alpha || 0;   // 绕 Z 轴（上下倾 → 刹车）
  rawBeta = e.beta || 0;     // 绕 X 轴（前后倾 → 油门）
  rawGamma = e.gamma || 0;   // 绕 Y 轴（左右倾 → 方向盘）

  // 校准偏移：发送值 = 原始值 - 校准偏移
  var g = rawGamma, b = rawBeta, a = rawAlpha;
  if (cal.has) {
    g = rawGamma - cal.gamma;
    b = rawBeta - cal.gas;
    a = rawAlpha - cal.brake;
  }

  // 方向轴：
  //   方向盘 = gamma（左右倾斜），左/右各 180° 为极限
  //   油门   = beta（前后倾斜），前移大、后移小
  //   刹车   = alpha（上下倾），上移松、下移踩
  yaw = a; roll = g; pitch = b;
  currentSteer = roll;
  currentPitch = pitch;

  // 油门：前移（beta 正）→ 油门大；后移（beta 负）→ 油门小（仅无点按时）
  // 刹车：alpha 校准后，下移（alpha 增）→ 踩；上移（alpha 减）→ 松
  if (!gasPressed && !brakePressed) {
    gas = clamp((b - 2) / 35, 0, 1);     // 前倾油门
    brake = clamp((a + 2) / 35, 0, 1);   // 下倾刹车（alpha 增加 = 下移）
  }

  // 显示原始值
  document.getElementById("v_raw").textContent =
    rawAlpha.toFixed(0) + " / " + rawBeta.toFixed(0) + " / " + rawGamma.toFixed(0);

  updateWheel();
  sendAll();
}

// 设备运动（加速度）
function handleMotion(e) {
  const a = e.accelerationIncludingGravity || {};
  accelX = a.x || 0;
  accelY = a.y || 0;
  accelZ = a.z || 0;
}

// Android Chrome 非 HTTPS 页面无法读取 deviceorientation：
// 降级到触屏方向盘 / 触屏油门刹车
(function() {
  var isSecure = (location.protocol === "https:" ||
                  location.hostname === "localhost" ||
                  location.hostname === "127.0.0.1");
  if (!isSecure) {
    setStatus(connected ? "已连接（触屏模式，无陀螺仪）" : "自动连接中...（触屏模式）", connected);
  }
})();

window.addEventListener("deviceorientation", handleOrientation, true);
window.addEventListener("devicemotion", handleMotion, true);
document.getElementById("calBtn").addEventListener("click", calibrate);

// ---- 触屏方向盘（非 HTTPS 降级） ----
var wheelEl = document.getElementById("wheel");
var wheelDrag = false;
var wheelStartX = 0;
var wheelStartAngle = 0;

wheelEl.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  wheelDrag = true;
  wheelStartAngle = currentSteer;
  wheelStartX = e.clientX;
});

window.addEventListener("pointermove", function(e) {
  if (!wheelDrag) return;
  var dx = e.clientX - wheelStartX;
  if (!gyroAvailable) {
    // 左右拖拽转向
    currentSteer = clamp(wheelStartAngle - dx * 0.4, -45, 45);
    updateWheel();
    sendAll();
  }
});

window.addEventListener("pointerup", function() { wheelDrag = false; });
window.addEventListener("pointercancel", function() { wheelDrag = false; });

// ---- 触屏油门/刹车（按住时递增；始终可用，不依赖陀螺仪） ----
var gasPressed = false, brakePressed = false;

function pedalLoop() {
  if (gasPressed) gas = clamp(gas + 0.08, 0, 1);
  else if (brakePressed) brake = clamp(brake + 0.08, 0, 1);
  else {
    // 无点按时，若陀螺仪可用则由倾斜控制；否则自然回零
    if (!gyroAvailable) {
      gas = clamp(gas - 0.05, 0, 1);
      brake = clamp(brake - 0.05, 0, 1);
    }
  }
  updateWheel();
  sendAll();
}

document.querySelector(".pedal.gas").addEventListener("pointerdown", function(e) {
  e.preventDefault();
  gasPressed = true; brakePressed = false;
});
document.querySelector(".pedal.gas").addEventListener("pointerup", function() { gasPressed = false; });
document.querySelector(".pedal.gas").addEventListener("pointercancel", function() { gasPressed = false; });
document.querySelector(".pedal.brake").addEventListener("pointerdown", function(e) {
  e.preventDefault();
  brakePressed = true; gasPressed = false;
});
document.querySelector(".pedal.brake").addEventListener("pointerup", function() { brakePressed = false; });
document.querySelector(".pedal.brake").addEventListener("pointercancel", function() { brakePressed = false; });

setInterval(pedalLoop, 50);

function updateWheel() {
  // 陀螺仪可用时用陀螺仪值；否则用触屏方向盘值
  const steerDeg = clamp(currentSteer, -45, 45);
  const wheel = document.getElementById("wheel");
  wheel.style.transform = "rotate(" + (-steerDeg) + "deg)";
  document.getElementById("v_roll").textContent = currentSteer.toFixed(1);
  document.getElementById("v_pitch").textContent = currentPitch.toFixed(1);

  document.getElementById("gasFill").style.height = (gas * 100) + "%";
  document.getElementById("brakeFill").style.height = (brake * 100) + "%";
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// 触屏按钮
function bindButton(id, key) {
  const el = document.getElementById(id);
  const press = (p) => {
    if (key.startsWith("dpad_")) {
      dpad[key.replace("dpad_", "")] = p;
    } else {
      buttons[key] = p;
    }
    el.classList.toggle("pressed", p);
    sendAll();
  };
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); press(true); });
  el.addEventListener("pointerup", (e) => { e.preventDefault(); press(false); });
  el.addEventListener("pointercancel", (e) => { press(false); });
  el.addEventListener("pointerleave", (e) => { press(false); });
}

bindButton("btn_a", "a");
bindButton("btn_b", "b");
bindButton("btn_x", "x");
bindButton("btn_y", "y");
bindButton("dpad_up", "dpad_up");
bindButton("dpad_down", "dpad_down");
bindButton("dpad_left", "dpad_left");
bindButton("dpad_right", "dpad_right");

// 发送
let lastSend = 0;

function deviceName() {
  var ua = navigator.userAgent || "";
  var m = ua.match(/\(([^)]+)\)/);
  var model = m ? m[1].split(";")[0].trim() : "Phone";
  return "Phone " + model;
}

function sendHello() {
  if (!connected || !ws || ws.readyState !== WebSocket.OPEN) return;
  var payload = {
    t: "hello",
    name: deviceName(),
    capabilities: [
      "gyroscope", "accelerometer", "buttons", "dpad", "gas", "brake"
    ]
  };
  ws.send(JSON.stringify(payload));
}

function sendAll() {
  if (!connected || !ws || ws.readyState !== WebSocket.OPEN) return;
  const now = performance.now();
  if (now - lastSend < 20) return; // ~50Hz 节流
  lastSend = now;

  const payload = {
    t: "sensors",
    roll: round(currentSteer),
    pitch: round(currentPitch),
    yaw: round(yaw),
    accelX: round(accelX),
    accelY: round(accelY),
    accelZ: round(accelZ),
    gas: round(gas),
    brake: round(brake),
    buttons: buttons,
    dpad: dpad,
  };
  ws.send(JSON.stringify(payload));
}

function round(v) { return Math.round(v * 1000) / 1000; }

// 自动重连 + 定期发送
setInterval(sendAll, 20);
</script>
